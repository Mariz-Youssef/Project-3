<mat-card class="example-card">
  <mat-card-header>
    <mat-card-title>Edit Patient</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <form [formGroup]="patientForm" (ngSubmit)="onSubmit()" *ngIf="!loading">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>First Name *</mat-label>
        <input matInput formControlName="firstName" placeholder="First Name">
        <mat-error *ngIf="f.firstName.errors?.['required']">
          First name is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Last Name *</mat-label>
        <input matInput formControlName="lastName" placeholder="Last Name">
        <mat-error *ngIf="f.lastName.errors?.['required']">
          Last name is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Email *</mat-label>
        <input matInput formControlName="email" placeholder="name@example.com" type="email">
        <mat-error *ngIf="f.email.errors?.['required']">
          Email is required
        </mat-error>
        <mat-error *ngIf="f.email.errors?.['email']">
          Please enter a valid email
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Phone *</mat-label>
        <input matInput formControlName="phone" placeholder="Phone number" type="tel">
        <mat-error *ngIf="f.phone.errors?.['required']">
          Phone number is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Date of Birth *</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="dateOfBirth" placeholder="Choose a date">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-error *ngIf="f.dateOfBirth.errors?.['required']">
          Date of birth is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Gender *</mat-label>
        <mat-select formControlName="gender">
          <mat-option value="">Select Gender</mat-option>
          <mat-option value="Male">Male</mat-option>
          <mat-option value="Female">Female</mat-option>
          <mat-option value="Other">Other</mat-option>
        </mat-select>
        <mat-error *ngIf="f.gender.errors?.['required']">
          Gender is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Address</mat-label>
        <input matInput formControlName="address" placeholder="Address">
        </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>City</mat-label>
        <input matInput formControlName="city" placeholder="City">
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>State</mat-label>
        <input matInput formControlName="state" placeholder="State">
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>ZIP Code</mat-label>
        <input matInput formControlName="zipCode" placeholder="ZIP Code">
      </mat-form-field>

      <div class="button-row">
        <button mat-flat-button color="primary" type="submit" [disabled]="patientForm.invalid || loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
          Update
        </button>
        <button mat-button (click)="onCancel()" type="button">
          Cancel
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
