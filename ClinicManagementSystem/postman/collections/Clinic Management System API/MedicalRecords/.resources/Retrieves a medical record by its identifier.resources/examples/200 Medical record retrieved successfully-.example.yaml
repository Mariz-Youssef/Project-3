$kind: http-example
name: 200 Medical record retrieved successfully.
request:
  url: "{{baseUrl}}/api/MedicalRecords/{{medicalRecordId}}"
  method: GET
  pathVariables:
    - key: medicalRecordId
      value: "{{medicalRecordId}}"
      description: Medical record identifier.
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "success": true,
        "message": "string",
        "data": {
          "id": 1,
          "appointmentId": 1,
          "doctorId": 1,
          "doctorName": "string",
          "patientId": 1,
          "patientName": "string",
          "appointmentDate": "2026-08-01T10:00:00Z",
          "diagnosis": "Seasonal flu",
          "notes": "Patient responded well to treatment.",
          "followUpDate": "2026-07-25",
          "createdAt": "2026-07-25T09:00:00Z",
          "updatedAt": "2026-07-25T09:00:00Z"
        },
        "errors": [
          "string"
        ],
        "timestamp": "2026-07-25T09:00:00Z",
        "traceId": "string",
        "pagination": {
          "pageNumber": 1,
          "pageSize": 1,
          "totalPages": 1,
          "totalRecords": 1,
          "hasNextPage": true,
          "hasPreviousPage": true
        }
      }
order: 1000
