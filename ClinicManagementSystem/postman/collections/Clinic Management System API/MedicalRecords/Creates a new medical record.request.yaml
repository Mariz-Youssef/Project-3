$kind: http-request
description: Only doctors are allowed to create medical records.
url: "{{baseUrl}}/api/MedicalRecords"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "appointmentId": 1,
      "diagnosis": "Seasonal flu",
      "notes": "Patient responded well to treatment.",
      "followUpDate": "2026-07-25"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200 || pm.response.code === 201) {
          const response = pm.response.json();
          const data = response.data || response;
          if (data && data.id) { pm.environment.set("medicalRecordId", data.id); }
          console.log("Saved medicalRecordId to environment.");
      }
    language: text/javascript
examples: ./.resources/Creates a new medical record.resources/examples
order: 2000
