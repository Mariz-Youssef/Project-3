$kind: http-request
description: Retrieves an appointment by identifier.
url: "{{baseUrl}}/api/Appointments/{{appointmentId}}"
method: GET
pathVariables:
  - key: appointmentId
    value: "{{appointmentId}}"
    description: Appointment identifier.
auth:
  type: bearer
  credentials:
    token: "{{token}}"
examples: ./.resources/Retrieves an appointment by identifier.resources/examples
order: 3000
