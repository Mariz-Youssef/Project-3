$kind: http-request
description: Creates a new appointment.
url: "{{baseUrl}}/api/Appointments"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "doctorId": 1,
      "appointmentDate": "2026-08-01T10:00:00Z",
      "startTime": "09:00:00",
      "endTime": "17:00:00",
      "reason": "Regular checkup",
      "notes": "Patient responded well to treatment."
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200 || pm.response.code === 201) {
          const response = pm.response.json();
          const data = response.data || response;
          if (data && data.id) { pm.environment.set("appointmentId", data.id); }
          console.log("Saved appointmentId to environment.");
      }
    language: text/javascript
examples: ./.resources/Creates a new appointment.resources/examples
order: 2000
