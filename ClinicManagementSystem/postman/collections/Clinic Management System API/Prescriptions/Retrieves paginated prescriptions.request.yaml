$kind: http-request
description: "Authorization: Admin: Returns all prescriptions. Doctor: Returns only prescriptions belonging to the authenticated doctor's patients. Patient: Returns only prescriptions that belong to the authenticated patient."
url: "{{baseUrl}}/api/Prescriptions"
method: GET
queryParams:
  - key: PageNumber
    value: ""
    disabled: true
    description: Gets or sets the current page number. Values less than or equal to zero are automatically replaced with the default page number.
  - key: PageSize
    value: ""
    disabled: true
    description: Gets or sets the number of records per page. Values less than or equal to zero are replaced with the default page size. Values greater than the maximum allowed page size are capped.
auth:
  type: bearer
  credentials:
    token: "{{token}}"
examples: ./.resources/Retrieves paginated prescriptions.resources/examples
order: 1000
