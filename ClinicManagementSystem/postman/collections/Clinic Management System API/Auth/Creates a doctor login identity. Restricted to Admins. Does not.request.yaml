$kind: http-request
name: Creates a doctor login identity. Restricted to Admins. Does not create a Doctor profile — the doctor must complete their profile after logging in
description: Creates a doctor login identity. Restricted to Admins. Does not create a Doctor profile — the doctor must complete their profile after logging in.
url: "{{baseUrl}}/api/auth/create-doctor-account"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "John Doe",
      "email": "john.doe@example.com",
      "password": "P@ssw0rd123!"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200 || pm.response.code === 201) {
          const response = pm.response.json();
          const data = response.data || response;
          if (data && data.id) { pm.environment.set("userId", data.id); }
          console.log("Saved userId to environment.");
      }
    language: text/javascript
examples: ./.resources/Creates a doctor login identity. Restricted to Admins. Does not.resources/examples
order: 2000
