$kind: http-request
name: Changes the authenticated user's password. Requires the current password for verification
description: Changes the authenticated user's password. Requires the current password for verification.
url: "{{baseUrl}}/api/auth/change-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "OldP@ss123!",
      "newPassword": "NewP@ss123!",
      "confirmNewPassword": "NewP@ss123!"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
examples: ./.resources/Changes the authenticated user's password. Requires the current.resources/examples
order: 6000
