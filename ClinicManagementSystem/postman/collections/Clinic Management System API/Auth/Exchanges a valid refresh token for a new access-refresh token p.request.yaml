$kind: http-request
name: Exchanges a valid refresh token for a new access/refresh token pair. The presented refresh token is revoked as part of rotation
description: Exchanges a valid refresh token for a new access/refresh token pair. The presented refresh token is revoked as part of rotation.
url: "{{baseUrl}}/api/auth/refresh-token"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "sample-refresh-token"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          const response = pm.response.json();
          const data = response.data || response;
          if (data.accessToken) { pm.environment.set("token", data.accessToken); }
          if (data.refreshToken) { pm.environment.set("refreshToken", data.refreshToken); }
          console.log("Tokens refreshed and saved to environment.");
      }
    language: text/javascript
examples: ./.resources/Exchanges a valid refresh token for a new access-refresh token p.resources/examples
order: 4000
