$kind: http-example
name: 200 The password was changed successfully.
request:
  url: "{{baseUrl}}/api/auth/change-password"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "currentPassword": "OldP@ss123!",
        "newPassword": "NewP@ss123!",
        "confirmNewPassword": "NewP@ss123!"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "success": true,
        "message": "string",
        "data": null,
        "errors": [
          "string"
        ],
        "timestamp": "2026-07-25T09:00:00Z",
        "traceId": "string",
        "pagination": {
          "pageNumber": 1,
          "pageSize": 1,
          "totalPages": 1,
          "totalRecords": 1,
          "hasNextPage": true,
          "hasPreviousPage": true
        }
      }
order: 1000
