$kind: http-request
description: Authenticates a user with email and password.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "john.doe@example.com",
      "password": "P@ssw0rd123!"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          const response = pm.response.json();
          const data = response.data || response;
          if (data.accessToken) { pm.environment.set("token", data.accessToken); }
          if (data.refreshToken) { pm.environment.set("refreshToken", data.refreshToken); }
          console.log("Tokens saved to environment.");
      }
    language: text/javascript
examples: ./.resources/Authenticates a user with email and password.resources/examples
order: 3000
