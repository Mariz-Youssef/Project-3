$kind: http-request
description: Retrieves a leave by its identifier.
url: "{{baseUrl}}/api/doctors/{{doctorId}}/leaves/{{leaveId}}"
method: GET
pathVariables:
  doctorId: "{{doctorId}}"
  leaveId: "{{leaveId}}"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
examples: ./.resources/Retrieves a leave by its identifier.resources/examples
order: 3000
