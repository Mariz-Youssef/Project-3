  token: ""
  refreshToken: ""
  patientId: ""
  doctorId: ""
  appointmentId: ""
  departmentId: ""
  medicalRecordId: ""
  prescriptionId: ""
  leaveId: ""
  workingHourId: ""
  userId: ""
auth:
