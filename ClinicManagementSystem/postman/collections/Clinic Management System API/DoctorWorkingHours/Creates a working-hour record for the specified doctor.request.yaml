$kind: http-request
description: Creates a working-hour record for the specified doctor.
url: "{{baseUrl}}/api/doctors/{{doctorId}}/working-hours"
method: POST
headers:
  Content-Type: application/json
pathVariables:
  - key: doctorId
    value: "{{doctorId}}"
    description: The doctor identifier.
body:
  type: json
  content: |-
    {
      "dayOfWeek": "Monday",
      "startTime": "09:00:00",
      "endTime": "17:00:00"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200 || pm.response.code === 201) {
          const response = pm.response.json();
          const data = response.data || response;
          if (data && data.id) { pm.environment.set("workingHourId", data.id); }
          console.log("Saved workingHourId to environment.");
      }
    language: text/javascript
examples: ./.resources/Creates a working-hour record for the specified doctor.resources/examples
order: 2000
