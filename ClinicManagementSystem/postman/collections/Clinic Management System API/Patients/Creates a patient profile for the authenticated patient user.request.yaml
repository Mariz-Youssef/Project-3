$kind: http-request
description: Creates a patient profile for the authenticated patient user.
url: "{{baseUrl}}/api/patients/profile"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dateOfBirth": "1990-05-15",
      "gender": "Male",
      "bloodGroup": "string",
      "address": "123 Main St, Cairo, Egypt",
      "allergies": "string",
      "medicalNotes": "string",
      "emergencyContactName": "string",
      "emergencyContactPhone": "string"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200 || pm.response.code === 201) {
          const response = pm.response.json();
          const data = response.data || response;
          if (data && data.id) { pm.environment.set("patientId", data.id); }
          console.log("Saved patientId to environment.");
      }
    language: text/javascript
order: 3000
