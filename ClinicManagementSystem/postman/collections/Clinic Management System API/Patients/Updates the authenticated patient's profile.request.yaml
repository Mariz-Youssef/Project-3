$kind: http-request
description: Updates the authenticated patient's profile.
url: "{{baseUrl}}/api/patients/profile"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "dateOfBirth": "1990-05-15",
      "gender": "Male",
      "bloodGroup": "string",
      "address": "123 Main St, Cairo, Egypt",
      "allergies": "string",
      "medicalNotes": "string",
      "emergencyContactName": "string",
      "emergencyContactPhone": "string"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 4000
