$kind: http-request
description: Creates a new doctor.
url: "{{baseUrl}}/api/Doctors"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userId": 1,
      "departmentId": 1,
      "specialization": "Cardiologist",
      "licenseNumber": "LIC-123456",
      "yearsOfExperience": 1,
      "consultationFee": 1.0
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200 || pm.response.code === 201) {
          const response = pm.response.json();
          const data = response.data || response;
          if (data && data.id) { pm.environment.set("doctorId", data.id); }
          console.log("Saved doctorId to environment.");
      }
    language: text/javascript
examples: ./.resources/Creates a new doctor.resources/examples
order: 2000
