    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "userId": 1,
        "departmentId": 1,
        "specialization": "Cardiologist",
        "licenseNumber": "LIC-123456",
        "yearsOfExperience": 1,
        "consultationFee": 1.0
      }
