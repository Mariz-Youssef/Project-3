$kind: http-request
description: Retrieves all doctors with a specific specialization.
url: "{{baseUrl}}/api/Doctors/specialization/{{specialization}}"
method: GET
queryParams:
  - key: PageNumber
    value: ""
    disabled: true
    description: Gets or sets the current page number. Values less than or equal to zero are automatically replaced with the default page number.
  - key: PageSize
    value: ""
    disabled: true
    description: Gets or sets the number of records per page. Values less than or equal to zero are replaced with the default page size. Values greater than the maximum allowed page size are capped.
pathVariables:
  - key: specialization
    value: "{{specialization}}"
    description: The doctor's specialization.
auth:
  type: bearer
  credentials:
    token: "{{token}}"
examples: ./.resources/Retrieves all doctors with a specific specialization.resources/examples
order: 7000
